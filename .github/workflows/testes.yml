# Roda os testes automaticamente a cada push e pull request.
name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest

    # Testa em várias versões do Python: o README promete suporte ao 3.10+
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Instalar o Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependências de desenvolvimento
        run: pip install -r requirements-dev.txt

      - name: Rodar os testes
        run: pytest -v

  site:
    runs-on: ubuntu-latest

    # O site fica em web/: os comandos rodam lá dentro
    defaults:
      run:
        working-directory: web

    # O Vitest 5 pede o Node 22.12 ou mais novo
    strategy:
      matrix:
        node-version: ["22", "24"]

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Instalar o Node ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Conferir o código (lint)
        run: npm run lint

      - name: Rodar os testes
        run: npm test -- --run

      - name: Conferir que o site compila
        run: npm run build
